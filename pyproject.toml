[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-001-seguridad-criptografica"
version = "1.0.0"
description = "MOD-001: contraseñas, datos y archivos protegidos con libsodium"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["argon2-cffi>=23.1,<26", "PyNaCl>=1.5,<2", "cryptography>=46,<49"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["seguridad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
